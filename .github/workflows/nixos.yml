name: NixOS CI

# Automatic CI is disabled while automatic updates are under development.
# The workflow can still be started manually from GitHub Actions.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check flake
        run: nix flake check

      - name: Build server
        run: nix build .#nixosConfigurations.server.config.system.build.toplevel
